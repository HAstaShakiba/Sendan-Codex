name: Sendan Codex baseline

on:
  push:
    branches: [sendan/develop]
    paths: [.github/workflows/sendan-codex-baseline.yml]
  pull_request:
    branches: [sendan/develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendan-codex-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_UPSTREAM_SHA: ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUST_MIN_STACK: '8388608'

jobs:
  upstream-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Report upstream HEAD
        run: |
          upstream_head=$(git ls-remote --exit-code https://github.com/openai/codex.git refs/heads/main | cut -f1)
          test -n "$upstream_head"
          printf 'Pinned `%s`\n\nUpstream main `%s`\n' "$CODEX_UPSTREAM_SHA" "$upstream_head" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$upstream_head" != "$CODEX_UPSTREAM_SHA" ]]; then
            echo '::notice::Upstream main differs from the validated baseline.'
          fi

  linux-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CODEX_UPSTREAM_SHA }}
          persist-credentials: false
      - name: Verify upstream checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CODEX_UPSTREAM_SHA"
          test -z "$(git status --porcelain)"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev libssl-dev cmake clang libclang-dev protobuf-compiler ripgrep
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
      - name: Build the unchanged Linux CLI
        id: build
        run: |
          cargo build --bin bwrap
          export CODEX_BWRAP_SHA256=$(sha256sum target/debug/bwrap | cut -d' ' -f1)
          printf 'CODEX_BWRAP_SHA256=%s\n' "$CODEX_BWRAP_SHA256" >> "$GITHUB_ENV"
          STABLE_GIT_COMMIT="$CODEX_UPSTREAM_SHA" cargo build --locked -p codex-cli --bin codex
      - name: Record build dependency resolution
        if: always() && !cancelled()
        run: |
          evidence="$RUNNER_TEMP/sendan-codex-package-evidence"
          mkdir -p "$evidence"
          git diff HEAD -- Cargo.lock > "$evidence/cargo-lock.diff"
          sha256sum Cargo.lock > "$evidence/cargo-lock.sha256"
      - name: Smoke-test the built binary
        run: |
          export CODEX_HOME=$(mktemp -d)
          target/debug/codex --version
          target/debug/codex exec --help
          target/debug/codex app-server --help
      - name: Assemble and smoke-test the Linux package
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          STABLE_GIT_COMMIT="$CODEX_UPSTREAM_SHA" cargo build --locked --bin codex-code-mode-host --bin codex-exec-server
          package="$RUNNER_TEMP/sendan-codex-package"
          evidence="$RUNNER_TEMP/sendan-codex-package-evidence"
          mkdir -p "$evidence"
          python3 ../scripts/build_codex_package.py --target x86_64-unknown-linux-gnu \
            --entrypoint-bin target/debug/codex --bwrap-bin target/debug/bwrap \
            --code-mode-host-bin target/debug/codex-code-mode-host \
            --exec-server-bin target/debug/codex-exec-server --package-dir "$package"
          cp ../LICENSE ../NOTICE "$package/"
          cp vendor/bubblewrap/COPYING "$package/bubblewrap-COPYING"
          cp vendor/bubblewrap/LICENSE "$package/bubblewrap-LICENSE"
          jq -n --arg sha "$CODEX_UPSTREAM_SHA" \
            '{upstream_sha:$sha, aicli_patch_version:0, target:"x86_64-unknown-linux-gnu", cargo_profile:"dev"}' \
            > "$package/sendan-provenance.json"
          tar -C "$package" -czf "$RUNNER_TEMP/sendan-codex-linux-x64.tar.gz" .
          (cd "$RUNNER_TEMP" && sha256sum sendan-codex-linux-x64.tar.gz) > "$evidence/SHA256SUMS"
          cp "$package/sendan-provenance.json" "$package/codex-package.json" "$evidence/"
          export CODEX_HOME=$(mktemp -d)
          extracted=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/sendan-codex-linux-x64.tar.gz" -C "$extracted"
          "$extracted/bin/codex" --version
          "$extracted/bin/codex" app-server --help
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && !cancelled()
        with:
          name: sendan-codex-linux-package-evidence
          path: ${{ runner.temp }}/sendan-codex-package-evidence/
          if-no-files-found: warn
      - name: Run upstream core suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          STABLE_GIT_COMMIT="$CODEX_UPSTREAM_SHA" NEXTEST_PROFILE=local cargo nextest run --locked --no-fail-fast \
            -p codex-core -p codex-exec -p codex-app-server -p codex-app-server-protocol \
            -p codex-tui -p codex-config -p codex-execpolicy -p codex-linux-sandbox
      - name: Verify upstream source files remain clean
        if: always() && !cancelled()
        run: git -C .. diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
