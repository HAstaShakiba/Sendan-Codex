name: Sendan Codex baseline

on:
  push:
    branches: [sendan/develop]
    paths: [.github/workflows/sendan-codex-baseline.yml]
  pull_request:
    branches: [sendan/develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendan-codex-baseline-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CODEX_UPSTREAM_SHA: ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
  CODEX_TEST_SHA: 9e59e679c183ea69bc71cf90b8fe84e5bc83bc51
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUST_MIN_STACK: '8388608'

jobs:
  upstream-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Report upstream HEAD
        run: |
          upstream_head=$(git ls-remote --exit-code https://github.com/openai/codex.git refs/heads/main | cut -f1)
          test -n "$upstream_head"
          printf 'Pinned `%s`\n\nUpstream main `%s`\n' "$CODEX_UPSTREAM_SHA" "$upstream_head" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$upstream_head" != "$CODEX_UPSTREAM_SHA" ]]; then
            echo '::notice::Upstream main differs from the validated baseline.'
          fi

  linux-baseline:
    name: Linux ${{ matrix.suite }}
    if: github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: package
          - suite: core
            packages: -p codex-core
          - suite: app-server
            packages: -p codex-app-server -p codex-app-server-protocol
          - suite: clients
            packages: -p codex-exec -p codex-tui
          - suite: policy
            packages: -p codex-config -p codex-execpolicy -p codex-linux-sandbox
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.suite == 'package' && env.CODEX_UPSTREAM_SHA || env.CODEX_TEST_SHA }}
          persist-credentials: false
      - name: Verify upstream checkout
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          test -z "$(git status --porcelain)"
          if [[ "$TEST_SUITE" == package ]]; then
            test "$(git rev-parse HEAD)" = "$CODEX_UPSTREAM_SHA"
          else
            test "$(git rev-parse HEAD)" = "$CODEX_TEST_SHA"
            git fetch --no-tags --depth=2 origin "$CODEX_UPSTREAM_SHA"
            test "$(git rev-parse "$CODEX_UPSTREAM_SHA^")" = "$CODEX_TEST_SHA"
            test "$(git diff --name-only HEAD "$CODEX_UPSTREAM_SHA")" = codex-rs/Cargo.toml
            git show "$CODEX_UPSTREAM_SHA:codex-rs/Cargo.toml" | sed 's/^version = "0\.171\.0"$/version = "0.0.0"/' | diff -u Cargo.toml -
          fi
      - uses: ./.github/actions/setup-ci
      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev libssl-dev cmake clang libclang-dev protobuf-compiler ripgrep bubblewrap
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Restore Rust compiler cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.CARGO_TARGET_DIR }}/sccache
          key: sendan-codex-sccache-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            sendan-codex-sccache-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.8.2
      - name: Start sccache
        env:
          SCCACHE_CACHE_SIZE: 2G
          SCCACHE_DIR: ${{ env.CARGO_TARGET_DIR }}/sccache
          SCCACHE_IDLE_TIMEOUT: '0'
        run: |
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: matrix.suite != 'package'
        with:
          tool: nextest
          version: 0.9.103
      - name: Build bubblewrap and record its digest
        run: |
          cargo build --bin bwrap
          bin_dir="$CARGO_TARGET_DIR/debug"
          install -D "$bin_dir/bwrap" "$bin_dir/codex-resources/bwrap"
          export CODEX_BWRAP_SHA256=$(sha256sum "$bin_dir/bwrap" | cut -d' ' -f1)
          printf 'CODEX_BWRAP_SHA256=%s\n' "$CODEX_BWRAP_SHA256" >> "$GITHUB_ENV"
      - name: Build the unchanged Linux CLI
        if: matrix.suite == 'package'
        run: STABLE_GIT_COMMIT="$CODEX_UPSTREAM_SHA" cargo build --locked -p codex-cli --bin codex
      - name: Build runtime and integration-test helpers
        if: matrix.suite != 'package' && matrix.suite != 'policy'
        run: |
          STABLE_GIT_COMMIT="$CODEX_TEST_SHA" cargo build --locked \
            --bin codex --bin codex-code-mode-host --bin codex-exec-server \
            --bin codex-linux-sandbox --bin test_stdio_server --bin codex-message-board-mcp
      - name: Record build dependency resolution
        if: ${{ always() && !cancelled() && matrix.suite == 'package' }}
        run: |
          evidence="$RUNNER_TEMP/sendan-codex-package-evidence"
          mkdir -p "$evidence"
          git diff HEAD -- Cargo.lock > "$evidence/cargo-lock.diff"
          sha256sum Cargo.lock > "$evidence/cargo-lock.sha256"
      - name: Smoke-test the built binary
        if: matrix.suite == 'package'
        run: |
          export CODEX_HOME=$(mktemp -d)
          "$CARGO_TARGET_DIR/debug/codex" --version
          "$CARGO_TARGET_DIR/debug/codex" exec --help
          "$CARGO_TARGET_DIR/debug/codex" app-server --help
      - name: Assemble and smoke-test the Linux package
        if: matrix.suite == 'package'
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          STABLE_GIT_COMMIT="$CODEX_UPSTREAM_SHA" cargo build --locked --bin codex-code-mode-host --bin codex-exec-server
          package="$RUNNER_TEMP/sendan-codex-package"
          evidence="$RUNNER_TEMP/sendan-codex-package-evidence"
          bin_dir="$CARGO_TARGET_DIR/debug"
          mkdir -p "$evidence"
          python3 ../scripts/build_codex_package.py --target x86_64-unknown-linux-gnu \
            --entrypoint-bin "$bin_dir/codex" --bwrap-bin "$bin_dir/bwrap" \
            --code-mode-host-bin "$bin_dir/codex-code-mode-host" \
            --exec-server-bin "$bin_dir/codex-exec-server" --package-dir "$package"
          cp ../LICENSE ../NOTICE "$package/"
          cp vendor/bubblewrap/COPYING "$package/bubblewrap-COPYING"
          cp vendor/bubblewrap/LICENSE "$package/bubblewrap-LICENSE"
          jq -n --arg sha "$CODEX_UPSTREAM_SHA" \
            '{upstream_sha:$sha, aicli_patch_version:0, target:"x86_64-unknown-linux-gnu", cargo_profile:"dev"}' \
            > "$package/sendan-provenance.json"
          tar -C "$package" -czf "$RUNNER_TEMP/sendan-codex-linux-x64.tar.gz" .
          (cd "$RUNNER_TEMP" && sha256sum sendan-codex-linux-x64.tar.gz) > "$evidence/SHA256SUMS"
          cp "$package/sendan-provenance.json" "$package/codex-package.json" "$evidence/"
          export CODEX_HOME=$(mktemp -d)
          extracted=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/sendan-codex-linux-x64.tar.gz" -C "$extracted"
          "$extracted/bin/codex" --version
          "$extracted/bin/codex" app-server --help
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && !cancelled() && matrix.suite == 'package' }}
        with:
          name: sendan-codex-linux-package-evidence
          path: ${{ runner.temp }}/sendan-codex-package-evidence/
          if-no-files-found: warn
      - name: Run upstream core suites
        if: matrix.suite != 'package'
        env:
          CARGO_BUILD_JOBS: '2'
          TEST_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$TEST_PACKAGES"
          (
            while true; do
              df -h "$CARGO_TARGET_DIR"
              free -m
              sleep 45
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          STABLE_GIT_COMMIT="$CODEX_TEST_SHA" NEXTEST_PROFILE=local cargo nextest run --locked --no-fail-fast "${packages[@]}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() && !cancelled() && matrix.suite != 'package' }}
        with:
          name: sendan-codex-nextest-${{ matrix.suite }}-junit
          path: codex-rs/target/nextest/local/junit.xml
      - name: Verify upstream source files remain clean
        if: always() && !cancelled()
        run: git -C .. diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'

  focused-apply-patch-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/sandbox-arg0-carveout'
    name: Sandbox carveout regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source relationship
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CODEX_UPSTREAM_SHA" HEAD
          test "$(git rev-parse "$CODEX_UPSTREAM_SHA^")" = "$CODEX_TEST_SHA"
          test "$(git -C .. diff --name-only "$CODEX_UPSTREAM_SHA"...HEAD -- codex-rs | sort | tr '\n' ' ')" = "codex-rs/linux-sandbox/src/bwrap.rs codex-rs/linux-sandbox/src/bwrap_tests.rs "
          git show "$CODEX_UPSTREAM_SHA:codex-rs/Cargo.toml" | diff -u Cargo.toml -
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev libssl-dev cmake clang libclang-dev protobuf-compiler ripgrep bubblewrap
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Build matching bubblewrap and test helpers
        run: |
          target=x86_64-unknown-linux-gnu
          cargo build --target "$target" --profile ci-test --bin bwrap
          bin_dir="$CARGO_TARGET_DIR/$target/ci-test"
          install -D "$bin_dir/bwrap" "$bin_dir/codex-resources/bwrap"
          export CODEX_BWRAP_SHA256=$(sha256sum "$bin_dir/bwrap" | cut -d' ' -f1)
          printf 'CODEX_BWRAP_SHA256=%s\n' "$CODEX_BWRAP_SHA256" >> "$GITHUB_ENV"
          STABLE_GIT_COMMIT="$CODEX_TEST_SHA" cargo build --locked --target "$target" --profile ci-test \
            --bin codex --bin codex-exec --bin codex-linux-sandbox \
            --bin codex-code-mode-host --bin codex-exec-server \
            --bin test_stdio_server --bin codex-message-board-mcp
      - name: Run the sandbox regression tests
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          target=x86_64-unknown-linux-gnu
          sandbox_helper="$CARGO_TARGET_DIR/$target/ci-test/codex-linux-sandbox"
          env \
            "CARGO_BIN_EXE_codex-linux-sandbox=$sandbox_helper" \
            "STABLE_GIT_COMMIT=$CODEX_TEST_SHA" \
            NEXTEST_PROFILE=local \
            cargo nextest run --locked --target "$target" --cargo-profile ci-test \
              -p codex-linux-sandbox \
              --filter-expr 'test(restricted_read_child)'
      - name: Run the previously failing apply_patch test
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          target=x86_64-unknown-linux-gnu
          sandbox_helper="$CARGO_TARGET_DIR/$target/ci-test/codex-linux-sandbox"
          env \
            "CARGO_BIN_EXE_codex-linux-sandbox=$sandbox_helper" \
            "CARGO_BIN_EXE_codex_linux_sandbox=$sandbox_helper" \
            "STABLE_GIT_COMMIT=$CODEX_TEST_SHA" \
            NEXTEST_PROFILE=local \
            cargo nextest run --locked --target "$target" --cargo-profile ci-test \
              -p codex-exec \
              --filter-expr 'test(nested_apply_patch_alias_works_with_restricted_reads)'
      - name: Use upstream test workspace version
        # Upstream TUI snapshots use the development workspace version (0.0.0).
        # The candidate checkout is the release tag, whose workspace says 0.171.0.
        run: |
          sed -i 's/^version = "0\.171\.0"$/version = "0.0.0"/' Cargo.toml
          grep -Fqx 'version = "0.0.0"' <(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | head -n 2 | tail -n 1)
      - name: Run full client and policy suites
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          target=x86_64-unknown-linux-gnu
          sandbox_helper="$CARGO_TARGET_DIR/$target/ci-test/codex-linux-sandbox"
          env \
            "CARGO_BIN_EXE_codex-linux-sandbox=$sandbox_helper" \
            "CARGO_BIN_EXE_codex_linux_sandbox=$sandbox_helper" \
            "STABLE_GIT_COMMIT=$CODEX_TEST_SHA" \
            RUST_MIN_STACK=8388608 \
            NEXTEST_PROFILE=local \
            cargo nextest run --no-fail-fast --target "$target" --cargo-profile ci-test \
              -p codex-config -p codex-execpolicy -p codex-linux-sandbox \
              -p codex-exec -p codex-tui
      - name: Restore release workspace manifest
        if: always()
        run: git -C .. checkout -- codex-rs/Cargo.toml codex-rs/Cargo.lock
      - name: Verify upstream source files remain clean
        if: always()
        run: git -C .. diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
