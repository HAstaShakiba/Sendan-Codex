name: Sendan Codex dependency inventory

on:
  push:
    branches: [sendan/develop]
    paths: [.github/workflows/sendan-codex-inventory.yml]
  pull_request:
    branches: [sendan/develop]
    paths: [.github/workflows/sendan-codex-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openai/codex
          ref: ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Generate CycloneDX SBOM and Cargo license inventory
        run: |
          cargo install --locked --version 0.5.10 cargo-cyclonedx
          out="$RUNNER_TEMP/sendan-codex-inventory"
          mkdir -p "$out/notices"
          cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu |
            jq -r '(["package","version","declared_license","license_file","source"] | @tsv), (.packages | sort_by(.name, .version)[] | [.name, .version, (.license // ""), (.license_file // ""), (.source // "workspace")] | @tsv)' > "$out/cargo-licenses.tsv"
          cargo cyclonedx --manifest-path Cargo.toml --target x86_64-unknown-linux-gnu --format json
          cp cli/codex-cli.cdx.json bwrap/codex-bwrap.cdx.json \
            code-mode-host/codex-code-mode-host.cdx.json exec-server-cli/codex-exec-server-cli.cdx.json "$out/"
          cp ../LICENSE ../NOTICE "$out/notices/"
          cp vendor/bubblewrap/COPYING "$out/notices/bubblewrap-COPYING"
          cp vendor/bubblewrap/LICENSE "$out/notices/bubblewrap-LICENSE"
          cp ../scripts/codex_package/rg "$out/ripgrep-dotslash-manifest"
          cp ../third_party/v8/*_release_manifests.sha256 "$out/"
          git rev-parse HEAD > "$out/upstream-sha.txt"
          git diff HEAD -- Cargo.lock > "$out/cargo-lock.diff"
          git -C .. diff --exit-code HEAD -- . ':(exclude)codex-rs/Cargo.lock'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sendan-codex-dependency-inventory
          path: ${{ runner.temp }}/sendan-codex-inventory/
          if-no-files-found: error
      - name: Check upstream dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.99.1
          manifest-path: ./codex-rs/Cargo.toml
